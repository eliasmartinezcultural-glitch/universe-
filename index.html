<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chañar — El Universo Vivo</title>
<style>
:root{--paper:#efe9dc;--dim:#a9aa9e}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030508;color:var(--paper);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 0 28%,rgba(0,0,0,.24) 70%,rgba(0,0,0,.72));mix-blend-mode:multiply}
#intro{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:25px;transition:1.5s;pointer-events:none}
#intro.hide{opacity:0;transform:scale(1.035);filter:blur(8px)}
.k{font-size:9px;letter-spacing:.48em;text-transform:uppercase;color:#a4aaa1;margin-bottom:24px}
h1{font-size:clamp(48px,10vw,118px);font-weight:300;letter-spacing:.19em;margin:0 0 20px;text-shadow:0 0 55px rgba(230,210,160,.12)}
#intro p{font-size:clamp(17px,2.7vw,27px);margin:0;line-height:1.45;color:#d9d5ca}
#start{margin-top:34px;pointer-events:auto;background:transparent;border:1px solid #ffffff32;color:#ddd8cc;border-radius:99px;padding:13px 26px;font-size:9px;letter-spacing:.3em;text-transform:uppercase}
#start:hover{background:#ffffff0b}
#stage{position:fixed;left:22px;top:19px;font-size:8px;letter-spacing:.3em;color:#777d77;text-transform:uppercase;opacity:0;transition:1s}
#hint{position:fixed;bottom:25px;width:100%;text-align:center;font-size:8px;letter-spacing:.32em;text-transform:uppercase;color:#7e857e;opacity:0;transition:1s}
#restart{position:fixed;right:17px;top:14px;border:0;background:none;color:#626861;font-size:8px;letter-spacing:.22em;display:none}
#quote{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(680px,86vw);font-size:clamp(18px,3vw,31px);line-height:1.35;opacity:0;pointer-events:none;transition:1.8s;text-shadow:0 2px 30px #000}
#quote.show{opacity:1}
small{font-size:.45em;letter-spacing:.08em;color:#a6aaa2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"></div>
<div id="intro"><div><div class="k">experiencia audiovisual interactiva</div><h1>CHAÑAR</h1><p>Antes de ser pueblo, hubo territorio.</p><button id="start">Entrar</button></div></div>
<div id="stage"></div><div id="hint"></div><div id="quote"></div><button id="restart">REINICIAR</button>
<script>
const c=document.querySelector("#c"),ctx=c.getContext("2d");
const intro=document.querySelector("#intro"),stageEl=document.querySelector("#stage"),hint=document.querySelector("#hint"),quote=document.querySelector("#quote"),restart=document.querySelector("#restart");
let W=innerWidth,H=innerHeight,dpr=1,t=0,running=false,mode=0,energy=0,mouse={x:-9999,y:-9999,vx:0,vy:0},lastMouse={x:0,y:0};
let wind=[],water=[],seeds=[],plants=[],paths=[],people=[],houses=[],sparks=[],ripples=[];
const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
function riverY(px){const u=px/W;return H*(.72-.23*u+.045*Math.sin(u*8+.4))}
function nearRiver(px,py){return Math.abs(py-riverY(px))<72}
function burst(x,y,n,type){type=type||"dust";for(let i=0;i<n;i++)sparks.push({x:x,y:y,vx:rand(-1.4,1.4),vy:rand(-1.4,1.4),life:1,size:rand(.5,2.3),type:type})}
function makeWind(){wind=[];const n=Math.min(1200,Math.floor(W*H/850));for(let i=0;i<n;i++)wind.push({x:rand(0,W),y:rand(0,H),vx:rand(.15,1.1),vy:rand(-.08,.08),a:rand(.08,.55),l:rand(10,34)})}
function makeWater(){water=[];for(let i=0;i<150;i++){let xx=rand(0,W),yy=riverY(xx)+rand(-8,8);water.push({x:xx,y:yy,s:rand(.2,1),a:rand(.2,.7)})}}
function addSeed(x,y,amount){amount=amount||1;for(let i=0;i<amount;i++){let px=x+rand(-32,32),py=y+rand(-24,24);if(nearRiver(px,py)||energy>7)seeds.push({x:px,y:py,b:t+rand(0,.8),life:rand(8,18)})}}
function grow(x,y,n){n=n||1;for(let i=0;i<n;i++){let p={x:x+rand(-28,28),y:y+rand(-22,22),b:t+rand(0,.6),h:rand(7,22),phase:rand(0,TAU)};plants.push(p);burst(p.x,p.y,4,"green")}energy+=.7}
function addPerson(x,y){people.push({x:x,y:y,b:t,s:rand(0,TAU),r:rand(2.1,3.2)});energy+=1.2;burst(x,y,12,"gold")}
function addPath(a,b){if(Math.hypot(a.x-b.x,a.y-b.y)<25)return;paths.push({a:{x:a.x,y:a.y},b:{x:b.x,y:b.y},life:1});for(let i=0;i<18;i++)sparks.push({x:a.x,y:a.y,tx:b.x,ty:b.y,life:1,size:rand(.7,1.8),type:"path"});energy+=2;if(paths.length%2===0&&!people.some(p=>Math.hypot(p.x-b.x,p.y-b.y)<35))addPerson(b.x,b.y)}
function houseAt(x,y){if(houses.some(h=>Math.hypot(h.x-x,h.y-y)<75))return;houses.push({x:x,y:y,b:t,s:rand(0,TAU),size:rand(11,20)});burst(x,y,28,"house");energy+=3}
function worldLevel(){return clamp(energy/34,0,1)}
function drawBackground(){
 const level=worldLevel(),g=ctx.createRadialGradient(W*.48,H*.5,0,W*.5,H*.5,Math.max(W,H)*.75);
 g.addColorStop(0,"rgba(76,94,79,"+(.10+.11*level)+")");g.addColorStop(.5,"rgba(33,50,48,"+(.07+.06*level)+")");g.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(level>.15){const glow=ctx.createRadialGradient(W*.53,riverY(W*.53),0,W*.53,riverY(W*.53),W*.45);glow.addColorStop(0,"rgba(80,170,188,"+(.025+.05*level)+")");glow.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=glow;ctx.fillRect(0,0,W,H)}
}
function drawLandscape(){
 const level=worldLevel();
 // Distant relief: depth only, never changes the interaction model.
 ctx.save();
 const horizon=H*.47;
 ctx.globalAlpha=.16+.10*level;
 ctx.fillStyle="rgba(39,52,49,1)";
 ctx.beginPath();
 ctx.moveTo(0,horizon+45);
 for(let x=0;x<=W+40;x+=40){
   const y=horizon-18*Math.sin(x*.004+1.4)-14*Math.sin(x*.011)+18*Math.sin(x*.021);
   ctx.lineTo(x,y);
 }
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
 ctx.globalAlpha=.10+.08*level;
 ctx.fillStyle="rgba(122,135,108,1)";
 ctx.beginPath();
 ctx.moveTo(0,horizon+82);
 for(let x=0;x<=W+40;x+=32){
   const y=horizon+35-11*Math.sin(x*.006)-9*Math.sin(x*.018+.7);
   ctx.lineTo(x,y);
 }
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
 // A very restrained celestial anchor gives the territory a sense of time.
 const orbX=W*(.18+.58*level), orbY=H*(.18+.08*Math.sin(t*.025));
 const orb=ctx.createRadialGradient(orbX,orbY,0,orbX,orbY,75+80*level);
 orb.addColorStop(0,"rgba(224,205,151,"+(.07+.06*level)+")");
 orb.addColorStop(1,"rgba(224,205,151,0)");
 ctx.fillStyle=orb;ctx.fillRect(orbX-160,orbY-160,320,320);
 ctx.restore();
}

function drawAtmosphere(){
 const level=worldLevel();
 // Thin environmental layers: depth, air and continuity.
 ctx.save();
 const horizon=riverY(W*.52);
 const fog=ctx.createLinearGradient(0,horizon-90,0,horizon+130);
 fog.addColorStop(0,"rgba(155,178,163,0)");
 fog.addColorStop(.5,"rgba(155,178,163,"+(.012+.025*level)+")");
 fog.addColorStop(1,"rgba(155,178,163,0)");
 ctx.fillStyle=fog;ctx.fillRect(0,horizon-110,W,250);
 for(let i=0;i<18;i++){
   const x=(i*137.37+t*(2+i*.08))%(W+120)-60;
   const y=H*(.14+(i%7)*.105)+Math.sin(t*.18+i)*10;
   const r=1.2+(i%4)*.7;
   ctx.fillStyle="rgba(205,213,192,"+(.025+.025*level)+")";
   ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
 }
 if(running && mouse.x>-1000){
   const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,115);
   g.addColorStop(0,"rgba(224,218,190,"+(.045+.035*level)+")");
   g.addColorStop(1,"rgba(224,218,190,0)");
   ctx.fillStyle=g;ctx.fillRect(mouse.x-130,mouse.y-130,260,260);
 }
 ctx.restore();
}

function drawWind(){
 for(const p of wind){let dx=mouse.x-p.x,dy=mouse.y-p.y,dist=Math.hypot(dx,dy);if(dist<150&&dist>1){p.vx+=dx/dist*.006;p.vy+=dy/dist*.006}p.x+=p.vx;p.y+=p.vy+Math.sin(t*.7+p.x*.006)*.08;if(p.x>W+40)p.x=-40;if(p.y<-30)p.y=H+30;if(p.y>H+30)p.y=-30;ctx.strokeStyle="rgba(215,221,210,"+(p.a*(.45+worldLevel()*.35))+")";ctx.lineWidth=.55;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.l,p.y-p.vy*8);ctx.stroke()}
}
function drawRiver(){
 ctx.save();ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-30,riverY(-30));ctx.bezierCurveTo(W*.28,H*.49,W*.47,H*.78,W*.66,H*.56);ctx.bezierCurveTo(W*.8,H*.42,W*.92,H*.62,W+30,riverY(W+30));
 ctx.strokeStyle="rgba(72,173,205,.07)";ctx.lineWidth=42;ctx.stroke();ctx.strokeStyle="rgba(104,202,231,.13)";ctx.lineWidth=15;ctx.stroke();ctx.strokeStyle="rgba(126,215,235,.65)";ctx.lineWidth=1.2;ctx.stroke();
 for(const p of water){p.x+=p.s*(.55+worldLevel());p.y=riverY(p.x)+Math.sin(t*1.8+p.x*.015)*5;if(p.x>W+5)p.x=-5;ctx.fillStyle="rgba(150,226,240,"+p.a+")";ctx.fillRect(p.x,p.y,rand(3,10),.6)}ctx.restore()
}
function drawPlants(){
 for(const p of plants){let k=clamp((t-p.b)*.8,0,1),s=k*k;if(!s)continue;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.sin(t+p.phase)*.04);ctx.globalAlpha=s;ctx.strokeStyle="rgba(151,209,111,.82)";ctx.lineWidth=1.15;ctx.beginPath();ctx.moveTo(0,7);ctx.lineTo(0,-p.h*s);ctx.stroke();ctx.beginPath();ctx.ellipse(-3,-p.h*.55,4,2.1,-.45,0,TAU);ctx.stroke();ctx.beginPath();ctx.ellipse(3,-p.h*.28,4,2.1,.45,0,TAU);ctx.stroke();ctx.restore()}
}
function drawSeeds(){
 for(let i=seeds.length-1;i>=0;i--){let s=seeds[i],k=clamp(1-(t-s.b)/s.life,0,1);if(k<=0){seeds.splice(i,1);continue}ctx.fillStyle="rgba(201,215,163,"+(k*.25)+")";ctx.beginPath();ctx.arc(s.x,s.y,1.2+k*3,0,TAU);ctx.fill()}
}
function drawPaths(){
 for(const p of paths){let pulse=.55+.25*Math.sin(t*2+p.a.x*.01);ctx.strokeStyle="rgba(230,194,103,"+(.2+pulse*.45)+")";ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(p.a.x,p.a.y);ctx.quadraticCurveTo((p.a.x+p.b.x)/2,(p.a.y+p.b.y)/2-20,p.b.x,p.b.y);ctx.stroke();ctx.fillStyle="rgba(244,221,145,.55)";ctx.beginPath();ctx.arc(p.a.x,p.a.y,1.8,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(p.b.x,p.b.y,1.8,0,TAU);ctx.fill()}
}
function drawConnections(){
 const level=worldLevel();
 if(level<.55)return;
 ctx.save();
 ctx.lineWidth=.55;
 for(const h of houses){
   let nearest=null,dist=Infinity;
   for(const p of people){
     const d=Math.hypot(p.x-h.x,p.y-h.y);
     if(d<dist){dist=d;nearest=p}
   }
   if(nearest&&dist<150){
     ctx.strokeStyle="rgba(232,207,151,"+(.10+.10*level)+")";
     ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.lineTo(nearest.x,nearest.y);ctx.stroke();
   }
 }
 for(const p of paths){
   ctx.strokeStyle="rgba(205,219,181,"+(.035+.045*level)+")";
   ctx.beginPath();ctx.moveTo(p.a.x,p.a.y);ctx.lineTo(p.b.x,p.b.y);ctx.stroke();
 }
 ctx.restore();
}

function drawPeople(){
 for(const p of people){let q=1+Math.sin(t*1.8+p.s)*.16;ctx.shadowBlur=20;ctx.shadowColor="rgba(239,215,157,.35)";ctx.fillStyle="rgba(244,229,191,.86)";ctx.beginPath();ctx.arc(p.x,p.y,p.r*q,0,TAU);ctx.fill();ctx.shadowBlur=0}
}
function drawHouses(){
 for(const h of houses){let k=clamp((t-h.b)*.7,0,1),s=k*k;ctx.save();ctx.translate(h.x,h.y);ctx.globalAlpha=s*.8;ctx.strokeStyle="rgba(232,204,145,.55)";ctx.lineWidth=1;ctx.beginPath();ctx.rect(-h.size*.65,-h.size*.45,h.size*1.3,h.size*.9);ctx.stroke();ctx.beginPath();ctx.moveTo(-h.size*.82,-h.size*.45);ctx.lineTo(0,-h.size*.95);ctx.lineTo(h.size*.82,-h.size*.45);ctx.stroke();ctx.restore()}
}
function drawSparks(){
 for(let i=sparks.length-1;i>=0;i--){let s=sparks[i];if(s.type==="path"){s.x+=(s.tx-s.x)*.025;s.y+=(s.ty-s.y)*.025}else{s.x+=s.vx;s.y+=s.vy;s.vx*=.985;s.vy*=.985}s.life-=.012;let alpha=clamp(s.life,0,1),col=s.type==="green"?"151,209,111":(s.type==="gold"||s.type==="house"?"235,204,126":"210,220,212");ctx.fillStyle="rgba("+col+","+alpha*.65+")";ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,TAU);ctx.fill();if(s.life<=0)sparks.splice(i,1)}
}
function drawRipples(){
 for(let i=ripples.length-1;i>=0;i--){let r=ripples[i];r.r+=1.4;r.a-=.015;ctx.strokeStyle="rgba(116,213,231,"+r.a+")";ctx.lineWidth=.7;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();if(r.a<=0)ripples.splice(i,1)}
}
function evolve(){
 let l=worldLevel();
 if(l>.12&&seeds.length<55&&Math.random()<.012)addSeed(rand(W*.12,W*.9),rand(H*.25,H*.85),1);
 if(l>.28&&plants.length<90&&Math.random()<.006){let px=rand(W*.08,W*.92),py=riverY(px)+rand(-90,90);grow(px,py,1)}
 if(l>.48&&people.length<14&&Math.random()<.0025){let p=paths[Math.floor(Math.random()*paths.length)];if(p)addPerson(p.b.x,p.b.y)}
 if(l>.68&&houses.length<7&&Math.random()<.0015){let p=people[Math.floor(Math.random()*people.length)];if(p)houseAt(p.x+rand(-32,32),p.y+rand(-25,25))}
}
function frame(){t+=.016;ctx.clearRect(0,0,W,H);if(!running){requestAnimationFrame(frame);return}drawBackground();drawLandscape();drawWind();drawRiver();drawSeeds();drawPlants();drawPaths();drawPeople();drawConnections();drawHouses();drawSparks();drawRipples();drawAtmosphere();evolve();requestAnimationFrame(frame)}
frame();

function setMode(m){
 mode=m;const names=["","VIENTO","AGUA","TIERRA","VIDA","CAMINOS","PERSONAS","PUEBLO"];
 stageEl.textContent=m?("0"+m+" · "+names[m]):"";
 hint.textContent=m===1?"mové el dedo o el cursor":m===5?"dibujá un camino entre dos lugares":"tocá · mové · dejá que el territorio responda";
 if(m>1)burst(W*.5,riverY(W*.5),Math.min(18,m*2),"dust");
 if(m===7){quote.innerHTML="<strong>San Patricio del Chañar</strong><br><small>Un pueblo no aparece de repente.<br>Crece cuando las cosas empiezan a conectarse.</small>";quote.classList.add("show");hint.textContent="el universo continúa vivo"}
}
function next(){if(mode<7)setMode(mode+1)}
function pointer(e){
 const r=c.getBoundingClientRect(),xx=e.clientX-r.left,yy=e.clientY-r.top;
 mouse.vx=xx-lastMouse.x;mouse.vy=yy-lastMouse.y;mouse.x=xx;mouse.y=yy;lastMouse={x:xx,y:yy};
 if(!running)return;
 ripples.push({x:xx,y:yy,r:2,a:.32});
 if(mode===1){burst(xx,yy,5,"dust");energy+=.12}
 else if(mode===2){addSeed(xx,yy,3);energy+=.35}
 else if(mode===3){grow(xx,yy,2)}
 else if(mode===4){grow(xx,yy,3);addSeed(xx,yy,4)}
 else if(mode===6){addPerson(xx,yy)}
 else if(mode===7){burst(xx,yy,9,"gold")}
}
let drawing=false,pathStart=null;
c.addEventListener("pointerdown",e=>{pointer(e);if(mode===5){drawing=true;pathStart={x:mouse.x,y:mouse.y}}});
c.addEventListener("pointermove",e=>{pointer(e);if(drawing&&mode===5&&pathStart&&Math.hypot(mouse.x-pathStart.x,mouse.y-pathStart.y)>90){addPath(pathStart,{x:mouse.x,y:mouse.y});pathStart={x:mouse.x,y:mouse.y}}});
addEventListener("pointerup",()=>{if(drawing&&pathStart&&mode===5&&Math.hypot(mouse.x-pathStart.x,mouse.y-pathStart.y)>45)addPath(pathStart,{x:mouse.x,y:mouse.y});drawing=false;pathStart=null});
c.addEventListener("click",()=>{if(running&&mode<7&&mode!==5)next()});
document.querySelector("#start").onclick=()=>{
 running=true;intro.classList.add("hide");stageEl.style.opacity=1;hint.style.opacity=1;restart.style.display="block";makeWind();makeWater();setMode(1);
 setTimeout(()=>setMode(2),8500);setTimeout(()=>setMode(3),16500);setTimeout(()=>setMode(4),24500);setTimeout(()=>setMode(5),33500);setTimeout(()=>setMode(6),43500);setTimeout(()=>setMode(7),55500)
};
restart.onclick=()=>location.reload();
</script>
</body>
</html>
